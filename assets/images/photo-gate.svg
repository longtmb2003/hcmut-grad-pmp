<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 315" width="100%" height="100%">
  <defs>
    <linearGradient id="gateSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="50%" stop-color="#004c8c"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="500" height="315" fill="url(#gateSky)"/>
  <!-- Hàng cây xanh sân trường -->
  <circle cx="60" cy="200" r="50" fill="#047857" opacity="0.6"/>
  <circle cx="440" cy="200" r="50" fill="#047857" opacity="0.6"/>
  <!-- Cổng trường Bách Khoa uy nghiêm -->
  <rect x="110" y="80" width="30" height="180" fill="#ffffff" rx="4"/>
  <rect x="360" y="80" width="30" height="180" fill="#ffffff" rx="4"/>
  <rect x="90" y="60" width="320" height="28" fill="#003366" rx="4"/>
  <text x="250" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ĐẠI HỌC BÁCH KHOA TP.HCM
  </text>
  <!-- Sân trường và vạch nắng -->
  <rect x="0" y="240" width="500" height="75" fill="#e2e8f0"/>
  <!-- Huy hiệu tốt nghiệp & bóng người chụp ảnh -->
  <g transform="translate(230, 160)">
    <circle cx="20" cy="18" r="14" fill="#ffdfba"/>
    <polygon points="20,0 5,8 20,15 35,8" fill="#002855"/>
    <path d="M5 32 L20 28 L35 32 L40 90 L0 90 Z" fill="#003366"/>
  </g>
  <rect x="0" y="260" width="500" height="55" fill="rgba(0,40,85,0.9)"/>
  <text x="250" y="293" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    CỔNG TRƯỜNG 268 LÝ THƯỜNG KIỆT · KỶ NIỆM 2021
  </text>
</svg>